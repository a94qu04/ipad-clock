    /* 翻頁鐘中間機械轉軸線與左右金屬卡榫 */
    .flip-hinge {

      height: 14px;

      border-radius: 2px;

    .flip-hinge:before { left: 4px; }
    .flip-hinge:after { right: 4px; }

    /* 上午/下午 標示 (12小時制時顯示) */
    .ampm-tag {

<body class="theme-flip">

  <!-- 軟體夜間調光遮罩 -->
  <div id="dimmer-overlay"></div>

  <!-- 輕量提示氣泡 -->
  <div id="toast-msg"></div>

  <script>
    /* ==========================================================================
       使用標準 ES5 語法撰寫，確保 iPad 2 / 3 / 4 / Air 1 (iOS 9 ~ 12) 完美執行
       ========================================================================== */
    (function() {
      // 應用程式狀態管理
      var state = {
        theme: 'theme-flip',
        is24Hour: true,
        burnInProtection: true,
        keepAwakeActive: false,
        dimLevel: 0,
        activeTab: 'quote', // 'quote' | 'memo' | 'pomo'
        city: {
          lat: 25.0620,
          lon: 121.6433,
          name: '新北市汐止區'
        },
        memoText: '記得補充水分，讓舊 iPad 繼續陪伴你的每一天。',
        quoteIndex: 0,
        pomoSeconds: 25 * 60,
        pomoRunning: false,
        lastHourStr: '',
        lastMinStr: ''
      };

      // 繁體中文靜心語錄庫
      var QUOTES = [
        '「慢下來，時間不是用來追趕，而是用來感受的。」',
        '「舊器物承載著時光的溫度，讓經典在書桌一角靜靜發光。」',
        '「專注於當下這一刻，把複雜留給世界，把平靜留給自己。」',
        '「每一個安靜的午後，都是重新整理思緒的最好時光。」',
        '「保持熱愛，奔赴下一場山海；從容不迫，靜待花開。」'
      ];

      // 嘗試讀取 localStorage 儲存設定
      function loadSavedSettings() {
        try {
          var savedTheme = localStorage.getItem('retro_ipad_theme');
          var saved24 = localStorage.getItem('retro_ipad_24h');
          var savedMemo = localStorage.getItem('retro_ipad_memo');
          var savedCity = localStorage.getItem('retro_ipad_city');
          if (savedTheme) state.theme = savedTheme;
          if (saved24 !== null) state.is24Hour = (saved24 === 'true');
          if (savedMemo) state.memoText = savedMemo;
          if (savedCity) {
            var parts = savedCity.split(',');
            if (parts.length === 3) {
              state.city = { lat: parseFloat(parts[0]), lon: parseFloat(parts[1]), name: parts[2] };
              document.getElementById('city-select').value = savedCity;
            }
          }
        } catch (e) {
          // 舊版無痕模式可能禁用 localStorage，安全忽略
        }
      }

      function saveSetting(key, val) {
        try {
          localStorage.setItem(key, val);
        } catch (e) {}
      }

      // 顯示提示浮動氣泡
      var toastTimer = null;
      function showToast(msg) {
        var el = document.getElementById('toast-msg');
        el.textContent = msg;
        el.className = 'show';
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(function() {
          el.className = '';
        }, 2600);
      }

      // 數字補零
      function padZero(num) {
        return num < 10 ? '0' + num : '' + num;
      }

      // 簡易農曆顯示輔助 (使用瀏覽器內建 Intl 支援時顯示，否則提供節氣/時辰)
      function getLunarOrPeriodText(dateObj) {
        try {
          if (window.Intl && Intl.DateTimeFormat) {
            var lunarStr = new Intl.DateTimeFormat('zh-TW-u-ca-chinese', {
              month: 'long',
              day: 'numeric'
            }).format(dateObj);
            if (lunarStr) {
              return '農曆 ' + lunarStr;
            }
          }
        } catch (e) {}
        var hr = dateObj.getHours();
        if (hr >= 5 && hr < 11) return '晨光時分';
        if (hr >= 11 && hr < 14) return '正午時分';
        if (hr >= 14 && hr < 18) return '午後時光';
        if (hr >= 18 && hr < 23) return '靜謐夜晚';
        return '深夜時分';
      }

      // 更新時鐘與日期
      function updateClock() {
        var now = new Date();
        var year = now.getFullYear();
        var month = now.getMonth() + 1;
        var day = now.getDate();
        var weekDays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
        var weekStr = weekDays[now.getDay()];
        var lunarInfo = getLunarOrPeriodText(now);

        document.getElementById('date-display').textContent =
          year + '年' + month + '月' + day + '日 ' + weekStr + ' · ' + lunarInfo;

        var rawHours = now.getHours();
        var minutes = now.getMinutes();
        var seconds = now.getSeconds();

        var displayHours = rawHours;
        var ampmStr = '';

        if (!state.is24Hour) {
          ampmStr = rawHours >= 12 ? '下午 PM' : '上午 AM';
          displayHours = rawHours % 12;
          if (displayHours === 0) displayHours = 12;
        }

        var hourStr = padZero(displayHours);
        var minStr = padZero(minutes);
        var secStr = padZero(seconds);

        document.getElementById('ampm-display').textContent = ampmStr;
        document.getElementById('second-digits').textContent = secStr;

        // 數字變化時觸發微翻頁動畫
        if (hourStr !== state.lastHourStr) {
          var hEl = document.getElementById('hour-digits');
          var hCard = document.getElementById('card-hour');
          hEl.textContent = hourStr;
          hCard.className = 'flip-card';
          void hCard.offsetWidth; // 強制重繪以重啟動畫
          hCard.className = 'flip-card flip-animate';
          state.lastHourStr = hourStr;
        }

        if (minStr !== state.lastMinStr) {
          var mEl = document.getElementById('minute-digits');
          var mCard = document.getElementById('card-minute');
          mEl.textContent = minStr;
          mCard.className = 'flip-card';
          void mCard.offsetWidth;
          mCard.className = 'flip-card flip-animate';
          state.lastMinStr = minStr;
        }
      }

      // ========================================================================
      // 天氣資訊抓取 (使用標準 XMLHttpRequest 確保舊版 Safari 相容性 + 離線備援)
      // ========================================================================
      function getWeatherIconSvg(code, isDay) {
        // 晴天
        if (code === 0 || code === 1) {
          if (isDay === 0) {
            return '<svg width="48" height="48" viewBox="0 0 64 64" fill="none"><path d="M40 14C30.6 14 23 21.6 23 31C23 40.4 30.6 48 40 48C43.5 48 46.8 46.9 49.5 45C42.1 44.3 36.3 38.1 36.3 30.5C36.3 23.4 41.3 17.5 48 16.2C45.6 14.8 42.9 14 40 14Z" fill="#FDE047"/></svg>';
          }
          return '<svg width="48" height="48" viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="14" fill="#FDB813"/><g stroke="#FDB813" stroke-width="3" stroke-linecap="round"><line x1="32" y1="8" x2="32" y2="13"/><line x1="32" y1="51" x2="32" y2="56"/><line x1="8" y1="32" x2="13" y2="32"/><line x1="51" y1="32" x2="56" y2="32"/><line x1="15" y1="15" x2="19" y2="19"/><line x1="45" y1="45" x2="49" y2="49"/><line x1="49" y1="15" x2="45" y2="19"/><line x1="19" y1="45" x2="15" y2="49"/></g></svg>';
        }
        // 多雲/陰天
        if (code === 2 || code === 3 || code === 45 || code === 48) {
          return '<svg width="48" height="48" viewBox="0 0 64 64" fill="none"><circle cx="25" cy="24" r="10" fill="#FDB813"/><path d="M44 46H22C16.5 46 12 41.5 12 36C12 30.8 16 26.5 21.1 26.1C23.2 21.3 28 18 33.5 18C40.7 18 46.6 23.6 47 30.7C50.9 31.8 53.8 35.4 53.8 39.6C53.8 43.2 50.8 46 47.2 46H44Z" fill="#CBD5E1"/></svg>';
        }
        // 下雨
        return '<svg width="48" height="48" viewBox="0 0 64 64" fill="none"><path d="M44 40H22C16.5 40 12 35.5 12 30C12 24.8 16 20.5 21.1 20.1C23.2 15.3 28 12 33.5 12C40.7 12 46.6 17.6 47 24.7C50.9 25.8 53.8 29.4 53.8 33.6C53.8 37.2 50.8 40 47.2 40H44Z" fill="#94A3B8"/><line x1="24" y1="45" x2="21" y2="53" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/><line x1="33" y1="45" x2="30" y2="53" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/><line x1="42" y1="45" x2="39" y2="53" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/></svg>';
      }

      function translateWeatherCode(code) {
        if (code === 0) return '晴朗無雲';
        if (code === 1 || code === 2) return '晴時多雲';
        if (code === 3) return '多雲時陰';
        if (code === 45 || code === 48) return '有霧';
        if (code >= 51 && code <= 67) return '細雨綿綿';
        if (code >= 80 && code <= 82) return '短暫陣雨';
        if (code >= 95) return '雷陣雨';
        return '舒適多雲';
      }

      function fetchWeather() {
        var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + state.city.lat +
          '&longitude=' + state.city.lon +
          '&current=temperature_2m,relative_humidity_2m,is_day,weather_code' +
          '&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FTaipei';

        try {
          var xhr = new XMLHttpRequest();
          xhr.open('GET', url, true);
          xhr.timeout = 8000;
          xhr.onreadystatechange = function() {
            if (xhr.readyState === 4) {
              if (xhr.status === 200) {
                try {
                  var data = JSON.parse(xhr.responseText);
                  var cur = data.current;
                  var daily = data.daily;
                  var temp = Math.round(cur.temperature_2m);
                  var hum = cur.relative_humidity_2m;
                  var code = cur.weather_code;
                  var isDay = cur.is_day;
                  var maxT = Math.round(daily.temperature_2m_max[0]);
                  var minT = Math.round(daily.temperature_2m_min[0]);
                  var rainProb = daily.precipitation_probability_max[0];

                  document.getElementById('weather-temp').textContent = temp + '°C';
                  document.getElementById('weather-condition').textContent =
                    state.city.name + ' · ' + translateWeatherCode(code);
                  document.getElementById('weather-humidity').textContent = '濕度：' + hum + '%';
                  document.getElementById('weather-rain').textContent = '降雨機率：' + (rainProb !== null ? rainProb : 20) + '%';
                  document.getElementById('weather-range').textContent = '高低溫：' + minT + '° ~ ' + maxT + '°';
                  document.getElementById('weather-svg-container').innerHTML = getWeatherIconSvg(code, isDay);
                } catch (parseErr) {
                  applyFallbackWeather();
                }
              } else {
                applyFallbackWeather();
              }
            }
          };
          xhr.onerror = applyFallbackWeather;
          xhr.ontimeout = applyFallbackWeather;
          xhr.send();
        } catch (e) {
          applyFallbackWeather();
        }
      }

      // 舊版 Safari 若因憑證或網路無法連線時的優雅備援天氣
      function applyFallbackWeather() {
        document.getElementById('weather-temp').textContent = '22°C';
        document.getElementById('weather-condition').textContent = state.city.name + ' · 晴時多雲';
        document.getElementById('weather-humidity').textContent = '濕度：68%';
        document.getElementById('weather-rain').textContent = '降雨機率：20%';
        document.getElementById('weather-range').textContent = '高低溫：19° ~ 24°';
      }

      // ========================================================================
      // 右側多功能卡片渲染 (每日語錄 / 桌面便籤 / 番茄鐘)
      // ========================================================================
      function renderSideCard() {
        var titleEl = document.getElementById('side-card-title');
        var contentEl = document.getElementById('side-card-content');

        // 更新分頁按鈕高亮
        var tabBtns = document.querySelectorAll('.side-tab-btn');
        for (var i = 0; i < tabBtns.length; i++) {
          var btn = tabBtns[i];
          if (btn.getAttribute('data-tab') === state.activeTab) {
            btn.className = 'side-tab-btn active';
          } else {
            btn.className = 'side-tab-btn';
          }
        }

        if (state.activeTab === 'quote') {
          titleEl.textContent = '每日靜心語錄 (點擊切換)';
          contentEl.innerHTML = '<span>' + QUOTES[state.quoteIndex] + '</span>';
        } else if (state.activeTab === 'memo') {
          titleEl.textContent = '桌面提醒便籤 (點擊編輯)';
          contentEl.innerHTML = '<span>' + escapeHtml(state.memoText) + '</span>';
        } else if (state.activeTab === 'pomo') {
          titleEl.textContent = '極簡專注番茄鐘';
          var mins = padZero(Math.floor(state.pomoSeconds / 60));
          var secs = padZero(state.pomoSeconds % 60);
          var toggleLabel = state.pomoRunning ? '暫停' : '開始';
          contentEl.innerHTML =
            '<span style="font-size:26px;font-weight:700;letter-spacing:1px;">' + mins + ':' + secs + '</span>' +
            '<div class="pomo-controls">' +
              '<button type="button" id="pomo-toggle-btn">' + toggleLabel + '</button>' +
              '<button type="button" id="pomo-reset-btn">重設</button>' +
            '</div>';

          // 綁定番茄鐘按鈕事件
          setTimeout(function() {
            var tBtn = document.getElementById('pomo-toggle-btn');
            var rBtn = document.getElementById('pomo-reset-btn');
            if (tBtn) {
              tBtn.onclick = function(e) {
                e.stopPropagation();
                state.pomoRunning = !state.pomoRunning;
                renderSideCard();
              };
            }
            if (rBtn) {
              rBtn.onclick = function(e) {
                e.stopPropagation();
                state.pomoRunning = false;
                state.pomoSeconds = 25 * 60;
                renderSideCard();
              };
            }
          }, 0);
        }
      }

      function escapeHtml(str) {
        return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      // 番茄鐘每秒倒數
      setInterval(function() {
        if (state.pomoRunning && state.pomoSeconds > 0) {
          state.pomoSeconds--;
          if (state.activeTab === 'pomo') {
            renderSideCard();
          }
          if (state.pomoSeconds === 0) {
            state.pomoRunning = false;
            showToast('番茄鐘專注時間完成！休息一下吧');
            renderSideCard();
          }
        }
      }, 1000);

      // ========================================================================
      // 螢幕防烙印微移保護 (Burn-in Pixel Shift)
      // 每 90 秒極其緩慢地微調畫面座標 (-6px ~ +6px)
      // ========================================================================
      var shiftStep = 0;
      var shiftOffsets = [
        { x: 0, y: 0 },
        { x: 5, y: 3 },
        { x: 3, y: -5 },
        { x: -5, y: -3 },
        { x: -3, y: 5 }
      ];

      setInterval(function() {
        var wrapper = document.getElementById('app-wrapper');
        if (!state.burnInProtection) {
          wrapper.style.webkitTransform = 'translate3d(0px, 0px, 0px)';
          wrapper.style.transform = 'translate3d(0px, 0px, 0px)';
          return;
        }
        shiftStep = (shiftStep + 1) % shiftOffsets.length;
        var pos = shiftOffsets[shiftStep];
        var tr = 'translate3d(' + pos.x + 'px, ' + pos.y + 'px, 0px)';
        wrapper.style.webkitTransform = tr;
        wrapper.style.transform = tr;
      }, 90000);

      // ========================================================================
      // 舊版 iPad 螢幕恆亮輔助 (透過播放無聲循環影片阻止系統自動休眠)
      // ========================================================================
      function toggleKeepAwake() {
        var video = document.getElementById('keep-awake-video');
        var dot = document.getElementById('awake-dot');
        var text = document.getElementById('awake-text');
        var btn = document.getElementById('btn-awake');

        if (!state.keepAwakeActive) {
          try {
            var playPromise = video.play();
            if (playPromise !== undefined) {
              playPromise.then(function() {
                state.keepAwakeActive = true;
                dot.className = 'awake-badge active';
                text.textContent = '螢幕恆亮模式已啟動';
                btn.className = 'ctrl-btn active';
                btn.textContent = '恆亮已啟動';
                showToast('已啟動螢幕防休眠模式，建議插上電源使用');
              }).catch(function() {
                showToast('請在 iPad「設定 > 螢幕顯示與亮度 > 自動鎖定」設為永不');
              });
            } else {
              state.keepAwakeActive = true;
              dot.className = 'awake-badge active';
              text.textContent = '螢幕恆亮模式已啟動';
              btn.className = 'ctrl-btn active';
              btn.textContent = '恆亮已啟動';
              showToast('已啟動螢幕防休眠模式');
            }
          } catch (e) {
            showToast('請將 iPad 系統「自動鎖定」設為永不以達最佳效果');
          }
        } else {
          video.pause();
          state.keepAwakeActive = false;
          dot.className = 'awake-badge';
          text.textContent = '點擊螢幕開啟設定面板';
          btn.className = 'ctrl-btn';
          btn.textContent = '啟動螢幕恆亮';
          showToast('已關閉網頁恆亮模式');
        }
      }

      // ========================================================================
      // 電池狀態偵測 (支援時顯示電量與充電狀態)
      // ========================================================================
      function initBatteryMonitor() {
        if (navigator.getBattery) {
          navigator.getBattery().then(function(battery) {
            function updateBat() {
              var pct = Math.round(battery.level * 100);
              var status = battery.charging ? '充電中' : '電池供電';
              document.getElementById('battery-text').textContent = status + ' ' + pct + '%';
            }
            updateBat();
            battery.addEventListener('levelchange', updateBat);
            battery.addEventListener('chargingchange', updateBat);
          });
        }
      }

      // ========================================================================
      // 控制面板顯示/自動隱藏邏輯 (5秒無操作自動隱藏)
      // ========================================================================
      var drawerTimer = null;
      var drawer = document.getElementById('control-drawer');

      function showControlDrawer() {
        drawer.className = 'visible';
        resetDrawerTimer();
      }

      function hideControlDrawer() {
        drawer.className = '';
      }

      function resetDrawerTimer() {
        if (drawerTimer) clearTimeout(drawerTimer);
        drawerTimer = setTimeout(function() {
          hideControlDrawer();
        }, 5500);
      }

      // ========================================================================
      // 事件綁定與初始化
      // ========================================================================
      function applyTheme(themeName) {
        state.theme = themeName;
        document.body.className = themeName;
        saveSetting('retro_ipad_theme', themeName);

        var themeBtns = document.querySelectorAll('[data-theme]');
        for (var i = 0; i < themeBtns.length; i++) {
          var b = themeBtns[i];
          b.className = (b.getAttribute('data-theme') === themeName) ? 'ctrl-btn active' : 'ctrl-btn';
        }
      }

      function initEvents() {
        // 點擊主畫面顯示/隱藏底部設定抽屜
        document.getElementById('app-wrapper').addEventListener('click', function(e) {
          // 若點擊的是右側卡片內部互動區則不重複觸發
          if (drawer.className === 'visible') {
            hideControlDrawer();
          } else {
            showControlDrawer();
          }
        });

        // 在控制抽屜內操作時重置自動隱藏計時器
        drawer.addEventListener('click', function(e) {
          e.stopPropagation();
          resetDrawerTimer();
        });

        // 主題切換按鈕
        var themeBtns = document.querySelectorAll('[data-theme]');
        for (var i = 0; i < themeBtns.length; i++) {
          themeBtns[i].addEventListener('click', function() {
            applyTheme(this.getAttribute('data-theme'));
          });
        }

        // 12/24 小時制切換
        var btnFormat = document.getElementById('btn-format');
        btnFormat.addEventListener('click', function() {
          state.is24Hour = !state.is24Hour;
          this.textContent = state.is24Hour ? '24小時制' : '12小時制';
          saveSetting('retro_ipad_24h', state.is24Hour);
          state.lastHourStr = ''; // 強制刷新小時顯示
          updateClock();
        });

        // 城市切換
        document.getElementById('city-select').addEventListener('change', function() {
          var val = this.value;
          var parts = val.split(',');
          state.city = {
            lat: parseFloat(parts[0]),
            lon: parseFloat(parts[1]),
            name: parts[2]
          };
          saveSetting('retro_ipad_city', val);
          fetchWeather();
          showToast('已更新地區：' + state.city.name);
        });

        // 夜間調光滑桿
        var dimmerSlider = document.getElementById('dimmer-slider');
        dimmerSlider.addEventListener('input', function() {
          resetDrawerTimer();
          var val = parseInt(this.value, 10);
          state.dimLevel = val;
          document.getElementById('dimmer-val').textContent = val + '%';
          document.getElementById('dimmer-overlay').style.opacity = (val / 100).toFixed(2);
        });

        // 防烙印開關
        document.getElementById('btn-burnin').addEventListener('click', function() {
          state.burnInProtection = !state.burnInProtection;
          this.className = state.burnInProtection ? 'ctrl-btn active' : 'ctrl-btn';
          this.textContent = state.burnInProtection ? '防烙印微移：開' : '防烙印微移：關';
          document.getElementById('burnin-indicator').textContent =
            state.burnInProtection ? '防烙印微移：開啟' : '防烙印微移：關閉';
        });

        // 螢幕恆亮按鈕
        document.getElementById('btn-awake').addEventListener('click', function() {
          toggleKeepAwake();
        });

        // 全螢幕按鈕
        document.getElementById('btn-fullscreen').addEventListener('click', function() {
          var docEl = document.documentElement;
          if (!document.fullscreenElement && !document.webkitFullscreenElement) {
            if (docEl.requestFullscreen) {
              docEl.requestFullscreen();
            } else if (docEl.webkitRequestFullscreen) {
              docEl.webkitRequestFullscreen();
            } else {
              showToast('在 iPad Safari 點擊「分享 > 加入主畫面」即可全螢幕執行！');
            }
          } else {
            if (document.exitFullscreen) {
              document.exitFullscreen();
            } else if (document.webkitExitFullscreen) {
              document.webkitExitFullscreen();
            }
          }
        });

        // 右側多功能卡片分頁切換
        var sideTabBtns = document.querySelectorAll('.side-tab-btn');
        for (var j = 0; j < sideTabBtns.length; j++) {
          sideTabBtns[j].addEventListener('click', function(e) {
            e.stopPropagation();
            state.activeTab = this.getAttribute('data-tab');
            renderSideCard();
          });
        }

        // 點擊右側卡片內容互動
        document.getElementById('side-widget').addEventListener('click', function(e) {
          e.stopPropagation();
          if (state.activeTab === 'quote') {
            state.quoteIndex = (state.quoteIndex + 1) % QUOTES.length;
            renderSideCard();
          } else if (state.activeTab === 'memo') {
            document.getElementById('memo-input').value = state.memoText;
            document.getElementById('memo-modal').className = 'modal-backdrop open';
          }
        });

        // 便籤彈窗按鈕
        document.getElementById('btn-memo-cancel').addEventListener('click', function() {
          document.getElementById('memo-modal').className = 'modal-backdrop';
        });

        document.getElementById('btn-memo-save').addEventListener('click', function() {
          var txt = document.getElementById('memo-input').value.trim();
          state.memoText = txt || '點擊此處新增桌面提醒事項...';
          saveSetting('retro_ipad_memo', state.memoText);
          document.getElementById('memo-modal').className = 'modal-backdrop';
          renderSideCard();
          showToast('桌面便籤已更新');
        });
      }

      // 啟動應用程式
      window.onload = function() {
        loadSavedSettings();
        applyTheme(state.theme);
        document.getElementById('btn-format').textContent = state.is24Hour ? '24小時制' : '12小時制';
        initEvents();
        initBatteryMonitor();
        updateClock();
        renderSideCard();
        fetchWeather();

        // 每秒更新時鐘
        setInterval(updateClock, 1000);
        // 每 30 分鐘自動更新一次天氣
        setInterval(fetchWeather, 30 * 60 * 1000);
        // 每 15 分鐘自動輪播一次語錄
        setInterval(function() {
          if (state.activeTab === 'quote') {
            state.quoteIndex = (state.quoteIndex + 1) % QUOTES.length;
            renderSideCard();
          }
        }, 15 * 60 * 1000);
      };
    })();
  </script>
</body>
</html>
