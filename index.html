<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="iPad 時鐘" />
  <title>iPad 桌面待機時鐘</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      color: #f5f5f7;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang TC", "Microsoft JhengHei", sans-serif;
    }

    /* 主容器與防烙印微移 */
    #app {
      position: relative;
      width: 100%;
      height: 100%;
      display: -webkit-flex;
      display: flex;
      -webkit-flex-direction: column;
      flex-direction: column;
      -webkit-justify-content: space-between;
      justify-content: space-between;
      -webkit-align-items: center;
      align-items: center;
      padding: 28px 36px 24px 36px;
      transition: transform 1.2s ease, background-color 0.4s ease, color 0.4s ease;
    }

    /* 夜間調光遮罩 */
    #dim-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #000000;
      opacity: 0;
      pointer-events: none;
      z-index: 50;
      transition: opacity 0.25s ease;
    }

    /* 頂部資訊列：日期、農曆、充電狀態 */
    #top-bar {
      width: 100%;
      display: -webkit-flex;
      display: flex;
      -webkit-justify-content: space-between;
      justify-content: space-between;
      -webkit-align-items: center;
      align-items: center;
      font-size: 20px;
      letter-spacing: 0.5px;
      z-index: 10;
      min-height: 32px;
    }
    .date-group {
      display: -webkit-flex;
      display: flex;
      -webkit-align-items: center;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }
    .lunar-badge {
      padding: 3px 10px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.1);
      font-size: 16px;
      color: #d1d1d6;
    }
    #battery-box {
      display: -webkit-flex;
      display: flex;
      -webkit-align-items: center;
      align-items: center;
      gap: 8px;
      font-size: 17px;
      color: #a1a1a6;
    }
    .battery-icon {
      display: inline-block;
      width: 28px;
      height: 14px;
      border: 1.5px solid currentColor;
      border-radius: 3px;
      padding: 1.5px;
      position: relative;
    }
    .battery-icon:after {
      content: "";
      position: absolute;
      right: -4px;
      top: 3px;
      width: 2px;
      height: 5px;
      background: currentColor;
      border-radius: 0 1px 1px 0;
    }
    .battery-fill {
      height: 100%;
      background: #30d158;
      width: 80%;
      transition: width 0.3s ease;
    }

    /* 中央時鐘縮放舞台 */
    #clock-stage {
      -webkit-flex: 1;
      flex: 1;
      display: -webkit-flex;
