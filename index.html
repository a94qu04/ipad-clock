<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="桌面時鐘" />
  <title>iPad 懷舊桌面待機時鐘</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "PingFang TC", sans-serif;
      transition: background-color 0.5s ease, color 0.5s ease;
    }

    /* 四大外觀主題 */
    body.theme-flip {
      background: radial-gradient(circle at 50% 55%, #1c1d24 0%, #09090b 82%, #000000 100%);
      color: #f4f4f6;
    }
    body.theme-lcd {
      background: radial-gradient(circle at 50% 55%, #1c2229 0%, #0a0d10 85%, #000000 100%);
      color: #d8e2dc;
    }
    body.theme-night {
      background: #000000;
      color: #8a909c;
    }
    body.theme-vfd {
      background: #000000;
      color: #2ce6c8;
    }

    #dim-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #000000;
      opacity: 0;
      pointer-events: none;
      z-index: 60;
      transition: opacity 0.25s ease;
    }

    /* 主容器 */
    #app-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: calc(env(safe-area-inset-top, 20px) + 14px) 3.5vw 3.5vh 3.5vw;
      transition: transform 1.5s ease-in-out;
    }

    /* ================= 頂部列（動態適應有無天氣卡片） ================= */
    .top-header-row {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      z-index: 10;
      gap: 16px;
      transition: all 0.3s ease;
    }

    /* 純時鐘模式時，頂部日期膠囊自動水平置中 */
    #app-container.mode-clock-only .top-header-row {
      justify-content: center;
      padding-top: 1.5vh;
    }

    .left-pills {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
    }

    #app-container.mode-clock-only .left-pills {
      flex-direction: row;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }

    .ios-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      border-radius: 15px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.11);
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0.4px;
    }

    body.theme-night .ios-pill {
      background: rgba(255, 255, 255, 0.03);
      border-color: rgba(255, 255, 255, 0.07);
      color: #7c828e;
    }

    body.theme-vfd .ios-pill {
      background: rgba(44, 230, 200, 0.06);
      border-color: rgba(44, 230, 200, 0.24);
      text-shadow: 0 0 8px rgba(44, 230, 200, 0.45);
    }

    .ios-chip {
      padding: 3px 10px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.09);
    }

    body.theme-vfd .ios-chip {
      background: rgba(44, 230, 200, 0.15);
      color: #5efce2;
    }

    .battery-charging {
      color: #34d399 !important;
    }

    /* ================= 右上角 iOS 15 2x1 寬版天氣 Widget ================= */
    .ios-weather-wide {
      width: 345px;
      border-radius: 22px;
      padding: 14px 18px 13px 18px;
      color: #ffffff;
      background: linear-gradient(155deg, #2b6cb0 0%, #1c3f70 55%, #122647 100%);
      border: 1px solid rgba(255, 255, 255, 0.22);
      box-shadow:
        0 14px 32px rgba(0, 0, 0, 0.65),
        inset 0 1px 1px rgba(255, 255, 255, 0.3);
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: all 0.5s ease;
    }

    .ios-weather-wide.sky-night {
      background: linear-gradient(155deg, #1b2845 0%, #0f172a 55%, #070b14 100%);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .ios-weather-wide.sky-rain {
      background: linear-gradient(155deg, #3b4c5e 0%, #232f3d 55%, #151c26 100%);
    }

    body.theme-night .ios-weather-wide {
      background: rgba(255, 255, 255, 0.035);
      border-color: rgba(255, 255, 255, 0.09);
      color: #a1a7b3;
      box-shadow: none;
    }

    body.theme-vfd .ios-weather-wide {
      background: rgba(44, 230, 200, 0.04);
      border-color: rgba(44, 230, 200, 0.25);
      color: #34f5d6;
      box-shadow: 0 0 24px rgba(44, 230, 200, 0.08);
    }

    .w-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .w-top-left {
      display: flex;
      flex-direction: column;
    }

    .w-city-row {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.2px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .w-temp-huge {
      font-size: 42px;
      font-weight: 300;
      line-height: 1.05;
      letter-spacing: -1.5px;
      margin-top: 2px;
      font-variant-numeric: tabular-nums;
    }

    .w-top-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      text-align: right;
    }

    .w-icon-sm {
      font-size: 21px;
      line-height: 1.1;
      margin-bottom: 3px;
    }

    .w-cond-text {
      font-size: 13px;
      font-weight: 600;
      opacity: 0.95;
    }

    .w-hl-text {
      font-size: 12px;
      font-weight: 500;
      opacity: 0.85;
      margin-top: 2px;
      font-variant-numeric: tabular-nums;
    }

    .w-hourly-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.14);
    }

    .w-hour-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      min-width: 42px;
    }

    .w-h-time {
      font-size: 11px;
      font-weight: 600;
      opacity: 0.78;
      font-variant-numeric: tabular-nums;
    }

    .w-h-icon {
      font-size: 16px;
      line-height: 1.1;
    }

    .w-h-temp {
      font-size: 14px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    /* ================= 中央時鐘舞台（黃金比例動態縮放） ================= */
    .clock-stage {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: center center;
      transition: transform 0.15s ease-out;
    }

    .flip-clock-group {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lcd-screen-inner {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2.2vw;
    }

    /* 預設（有天氣卡片時）：比例收斂得宜，不擁擠 */
    .flip-unit {
      position: relative;
      width: 28vw;
      max-width: 340px;
      height: 44vh;
      max-height: 350px;
      border-radius: 26px;
      background: linear-gradient(180deg, #2b2d36 0%, #1d1e24 49.5%, #131418 50.5%, #1c1d23 100%);
      box-shadow:
        0 24px 54px rgba(0, 0, 0, 0.85),
        0 4px 12px rgba(0, 0, 0, 0.6),
        inset 0 1px 1px rgba(255, 255, 255, 0.18),
        inset 0 -2px 4px rgba(0, 0, 0, 0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21vw;
      font-weight: 700;
      letter-spacing: -0.6vw;
      color: #f3f4f6;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.55);
      font-variant-numeric: tabular-nums;
      overflow: hidden;
      transition: all 0.35s ease;
    }

    /* 純時鐘模式（無天氣卡片時）：滿版放大且視覺重心平衡 */
    #app-container.mode-clock-only .flip-unit {
      width: 34vw;
      max-width: 420px;
      height: 56vh;
      max-height: 440px;
      font-size: 25.5vw;
    }

    .flip-unit .hinge-line {
      position: absolute;
      left: 0; right: 0; top: 50%;
      height: 3px;
      margin-top: -1.5px;
      background: linear-gradient(180deg, #09090b 0%, #27272a 100%);
      z-index: 5;
    }

    .flip-unit .hinge-left,
    .flip-unit .hinge-right {
      position: absolute;
      top: 50%;
      width: 11px;
      height: 24px;
      margin-top: -12px;
      background: linear-gradient(180deg, #52525b 0%, #27272a 100%);
      z-index: 6;
    }
    .flip-unit .hinge-left { left: 0; border-radius: 0 3px 3px 0; }
    .flip-unit .hinge-right { right: 0; border-radius: 3px 0 0 3px; }

    .flip-unit .top-gloss {
      position: absolute;
      top: 0; left: 0; right: 0; height: 50%;
      background: linear-gradient(180deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0) 100%);
      pointer-events: none;
    }

    .flip-unit .ampm-tag {
      position: absolute;
      left: 20px;
      bottom: 16px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #a1a1aa;
    }

    .flip-unit .sec-tag {
      position: absolute;
      right: 20px;
      bottom: 16px;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 0;
      color: #a1a1aa;
    }

    .flip-animate {
      animation: cardPulse 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }
    @keyframes cardPulse {
      0% { transform: scaleY(0.95); filter: brightness(1.18); }
      100% { transform: scaleY(1); filter: brightness(1); }
    }

    /* 主題 2：擬物液晶座鐘 */
    body.theme-lcd .flip-clock-group {
      background: linear-gradient(145deg, #2c333d, #181c22);
      padding: 20px 28px;
      border-radius: 34px;
      border: 2px solid #38414d;
      box-shadow: 0 26px 60px rgba(0, 0, 0, 0.85), inset 0 2px 3px rgba(255, 255, 255, 0.15);
    }
    body.theme-lcd .lcd-screen-inner {
      background: linear-gradient(180deg, #8fa399 0%, #7d9187 100%);
      padding: 22px 34px;
      border-radius: 20px;
      box-shadow: inset 0 6px 16px rgba(0, 0, 0, 0.45), inset 0 0 0 2px rgba(0, 0, 0, 0.2);
    }
    body.theme-lcd .flip-unit {
      background: transparent;
      box-shadow: none;
      width: auto;
      height: 36vh;
      color: #141c18;
      text-shadow: 3px 5px 0px rgba(20, 28, 24, 0.14);
      font-family: "Courier New", Courier, monospace;
      font-weight: 800;
      font-size: 19vw;
    }
    body.theme-lcd #app-container.mode-clock-only .flip-unit {
      height: 46vh;
      font-size: 22vw;
    }
    body.theme-lcd .hinge-line,
    body.theme-lcd .hinge-left,
    body.theme-lcd .hinge-right,
    body.theme-lcd .top-gloss { display: none; }
    body.theme-lcd .ampm-tag,
    body.theme-lcd .sec-tag {
      color: #1e2923;
      position: static;
      font-size: 26px;
    }

    /* 主題 3：極簡深色夜鐘（緊湊高雅排版，不分散） */
    body.theme-night .lcd-screen-inner {
      gap: 1.6vw;
    }
    body.theme-night .flip-unit {
      background: transparent;
      box-shadow: none;
      width: auto;
      padding: 0 1.2vw;
      height: 42vh;
      color: #8a909c;
      text-shadow: none;
      font-weight: 600;
      font-size: 22vw;
      letter-spacing: -0.5vw;
    }
    body.theme-night #app-container.mode-clock-only .flip-unit {
      height: 52vh;
      font-size: 26vw;
    }
    body.theme-night .hinge-line,
    body.theme-night .hinge-left,
    body.theme-night .hinge-right,
    body.theme-night .top-gloss { display: none; }
    body.theme-night .ampm-tag {
      left: 1.4vw;
      bottom: 2vh;
      font-size: 20px;
      color: #5b616e;
    }
    body.theme-night .sec-tag {
      right: 1.4vw;
      bottom: 2vh;
      font-size: 22px;
      color: #5b616e;
    }

    /* 主題 4：復古 VFD 螢光管 */
    body.theme-vfd .flip-unit {
      background: rgba(44, 230, 200, 0.03);
      border: 1px solid rgba(44, 230, 200, 0.22);
      box-shadow: 0 0 36px rgba(44, 230, 200, 0.1), inset 0 0 20px rgba(44, 230, 200, 0.06);
      color: #34f5d6;
      text-shadow: 0 0 18px rgba(52, 245, 214, 0.75), 0 0 40px rgba(52, 245, 214, 0.35);
      font-family: "Courier New", Courier, monospace;
    }
    body.theme-vfd .hinge-line { background: rgba(44, 230, 200, 0.15); height: 1px; }
    body.theme-vfd .hinge-left, body.theme-vfd .hinge-right { display: none; }
    body.theme-vfd .ampm-tag, body.theme-vfd .sec-tag { color: #2ce6c8; }

    .colon-sep {
      font-size: 13vw;
      font-weight: 700;
      opacity: 0.65;
      padding-bottom: 2vh;
      animation: colonBlink 2s infinite;
    }
    #app-container.mode-clock-only .colon-sep {
      font-size: 15vw;
    }
    body.theme-lcd .colon-sep { color: #141c18; }
    body.theme-vfd .colon-sep { color: #34f5d6; text-shadow: 0 0 18px rgba(52, 245, 214, 0.75); }

    @keyframes colonBlink {
      0%, 49% { opacity: 0.85; }
      50%, 100% { opacity: 0.2; }
    }

    /* ================= 底部 iOS 15 毛玻璃控制面板 ================= */
    #control-panel {
      position: fixed;
      left: 20px;
      right: 20px;
      bottom: 20px;
      background: rgba(24, 25, 30, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.16);
      -webkit-backdrop-filter: blur(24px);
      backdrop-filter: blur(24px);
      border-radius: 24px;
      padding: 16px 20px;
      color: #f4f4f6;
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85);
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    #control-panel.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateY(24px);
    }

    .ctrl-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .ctrl-label {
      font-size: 13px;
      font-weight: 600;
      color: #9ca3af;
      margin-right: 4px;
      min-width: 62px;
    }

    .btn, .city-select {
      background: rgba(255, 255, 255, 0.08);
      color: #f3f4f6;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 10px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }

    .btn.active {
      background: #0a84ff;
      border-color: #409cff;
      color: #ffffff;
      font-weight: 600;
    }

    .slider-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 200px;
      background: rgba(255, 255, 255, 0.05);
      padding: 6px 12px;
      border-radius: 10px;
    }

    input[type="range"] {
      flex: 1;
      accent-color: #0a84ff;
      height: 6px;
    }

    .val-text {
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      width: 44px;
      text-align: right;
      color: #d1d5db;
    }

    .hidden-item {
      display: none !important;
    }
  </style>
</head>
<body class="theme-flip">

  <div id="dim-overlay"></div>

  <div id="app-container">
    <!-- 頂部列 -->
    <div class="top-header-row">
      <div class="left-pills">
        <div class="ios-pill" id="date-pill">
          <span id="disp-year"></span>
          <span id="disp-month"></span>
          <span id="disp-day"></span>
          <span id="disp-week" class="ios-chip"></span>
          <span id="disp-lunar" class="ios-chip"></span>
        </div>

        <div class="ios-pill" id="battery-pill">
          <span id="disp-battery" class="battery-charging">⚡ 桌面插電待機</span>
        </div>
      </div>

      <!-- 右上角 iOS 15 2x1 寬版天氣小工具 -->
      <div class="ios-weather-wide" id="disp-weather">
        <div class="w-top">
          <div class="w-top-left">
            <div class="w-city-row"><span id="w-city-name">汐止區</span> <span style="font-size:12px;">📍</span></div>
            <div class="w-temp-huge" id="w-temp">--°</div>
          </div>
          <div class="w-top-right">
            <div class="w-icon-sm" id="w-icon">⛅</div>
            <div class="w-cond-text" id="w-desc">載入氣象中</div>
            <div class="w-hl-text" id="w-hl">最高 --°  最低 --°</div>
          </div>
        </div>

        <div class="w-hourly-row" id="w-hourly-list">
          <div class="w-hour-col"><span class="w-h-time">--時</span><span class="w-h-icon">⛅</span><span class="w-h-temp">--°</span></div>
          <div class="w-hour-col"><span class="w-h-time">--時</span><span class="w-h-icon">⛅</span><span class="w-h-temp">--°</span></div>
          <div class="w-hour-col"><span class="w-h-time">--時</span><span class="w-h-icon">⛅</span><span class="w-h-temp">--°</span></div>
          <div class="w-hour-col"><span class="w-h-time">--時</span><span class="w-h-icon">⛅</span><span class="w-h-temp">--°</span></div>
          <div class="w-hour-col"><span class="w-h-time">--時</span><span class="w-h-icon">⛅</span><span class="w-h-temp">--°</span></div>
          <div class="w-hour-col"><span class="w-h-time">--時</span><span class="w-h-icon">⛅</span><span class="w-h-temp">--°</span></div>
        </div>
      </div>
    </div>

    <!-- 中央大尺寸時鐘舞台 -->
    <div class="clock-stage" id="clock-stage">
      <div class="flip-clock-group">
        <div class="lcd-screen-inner">
          <div class="flip-unit" id="card-hours">
            <div class="top-gloss"></div>
            <div class="hinge-line"></div>
            <div class="hinge-left"></div>
            <div class="hinge-right"></div>
            <span id="hours">00</span>
            <span class="ampm-tag" id="ampm">AM</span>
          </div>

          <div class="colon-sep">:</div>

          <div class="flip-unit" id="card-minutes">
            <div class="top-gloss"></div>
            <div class="hinge-line"></div>
            <div class="hinge-left"></div>
            <div class="hinge-right"></div>
            <span id="minutes">00</span>
            <span class="sec-tag" id="seconds">00</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 底部控制面板 -->
  <div id="control-panel">
    <div class="ctrl-row">
      <span class="ctrl-label">外觀主題</span>
      <button class="btn active" data-theme="theme-flip">機械翻頁鐘</button>
      <button class="btn" data-theme="theme-lcd">擬物液晶座鐘</button>
      <button class="btn" data-theme="theme-night">極簡深色夜鐘</button>
      <button class="btn" data-theme="theme-vfd">復古 VFD 螢光管</button>
      <select class="city-select" id="city-select" style="margin-left:auto;">
        <option value="25.066,121.662,汐止區">📍 新北汐止</option>
        <option value="25.033,121.565,台北市">📍 台北市</option>
        <option value="24.993,121.301,桃園市">📍 桃園市</option>
        <option value="24.806,120.968,新竹市">📍 新竹市</option>
        <option value="24.147,120.673,台中市">📍 台中市</option>
        <option value="22.999,120.227,台南市">📍 台南市</option>
        <option value="22.627,120.301,高雄市">📍 高雄市</option>
      </select>
      <button class="btn" id="btn-wakelock">啟動螢幕恆亮</button>
    </div>

    <div class="ctrl-row">
      <span class="ctrl-label">顯示資訊</span>
      <button class="btn active" data-toggle="year">年</button>
      <button class="btn active" data-toggle="month">月</button>
      <button class="btn active" data-toggle="day">日</button>
      <button class="btn active" data-toggle="week">星期</button>
      <button class="btn active" data-toggle="lunar">農曆</button>
      <button class="btn active" data-toggle="battery">充電狀態</button>
      <button class="btn active" data-toggle="weather">天氣卡片</button>
    </div>

    <div class="ctrl-row">
      <div class="slider-wrap">
        <span class="ctrl-label">時鐘大小</span>
        <input type="range" id="scale-slider" min="60" max="140" value="100" />
        <span class="val-text" id="scale-val">100%</span>
      </div>

      <div class="slider-wrap">
        <span class="ctrl-label">夜間調光</span>
        <input type="range" id="dim-slider" min="0" max="80" value="0" />
        <span class="val-text" id="dim-val">0%</span>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var pad = function (n) { return n < 10 ? "0" + n : "" + n; };
      var weekDays = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
      var lastHour = "";
      var lastMin = "";

      var state = {
        theme: localStorage.getItem("ipad_clock_theme_v5") || "theme-flip",
        city: localStorage.getItem("ipad_clock_city_v5") || "25.066,121.662,汐止區",
        scale: parseInt(localStorage.getItem("ipad_clock_scale_v5") || "100", 10),
        dim: parseInt(localStorage.getItem("ipad_clock_dim_v5") || "0", 10),
        toggles: JSON.parse(localStorage.getItem("ipad_clock_toggles_v5") || '{"year":true,"month":true,"day":true,"week":true,"lunar":true,"battery":true,"weather":true}')
      };

      function triggerFlip(cardId) {
        var el = document.getElementById(cardId);
        el.classList.remove("flip-animate");
        void el.offsetWidth;
        el.classList.add("flip-animate");
      }

      function updateClock() {
        var now = new Date();
        var h24 = now.getHours();
        var hStr = pad(h24);
        var mStr = pad(now.getMinutes());
        var sStr = pad(now.getSeconds());

        if (hStr !== lastHour) {
          document.getElementById("hours").textContent = hStr;
          if (lastHour !== "") triggerFlip("card-hours");
          lastHour = hStr;
        }
        if (mStr !== lastMin) {
          document.getElementById("minutes").textContent = mStr;
          if (lastMin !== "") triggerFlip("card-minutes");
          lastMin = mStr;
        }
        document.getElementById("seconds").textContent = sStr;
        document.getElementById("ampm").textContent = h24 >= 12 ? "PM" : "AM";

        document.getElementById("disp-year").textContent = now.getFullYear() + "年";
        document.getElementById("disp-month").textContent = (now.getMonth() + 1) + "月";
        document.getElementById("disp-day").textContent = now.getDate() + "日";
        document.getElementById("disp-week").textContent = weekDays[now.getDay()];

        try {
          var lunarStr = new Intl.DateTimeFormat("zh-TW-u-ca-chinese", { month: "short", day: "numeric" }).format(now);
          document.getElementById("disp-lunar").textContent = "農曆 " + lunarStr;
        } catch (e) {
          document.getElementById("disp-lunar").textContent = "";
        }
      }

      function initBattery() {
        var batEl = document.getElementById("disp-battery");
        if (navigator.getBattery) {
          navigator.getBattery().then(function (bat) {
            function refreshBat() {
              var pct = Math.round(bat.level * 100) + "%";
              if (bat.charging) {
                batEl.textContent = "⚡ 充電中 " + pct;
                batEl.classList.add("battery-charging");
              } else {
                batEl.textContent = "🔋 電池 " + pct;
                batEl.classList.remove("battery-charging");
              }
            }
            refreshBat();
            bat.addEventListener("levelchange", refreshBat);
            bat.addEventListener("chargingchange", refreshBat);
          });
        } else {
          batEl.textContent = "⚡ 桌面插電待機";
          batEl.classList.add("battery-charging");
        }
      }

      function getWeatherIconAndDesc(code, isDay) {
        if (code >= 51) return { icon: "🌧️", desc: "陣雨 / 陰雨", sky: "sky-rain" };
        if (code >= 1 && code <= 3) return { icon: isDay ? "⛅" : "☁️", desc: "多雲時晴", sky: isDay ? "" : "sky-night" };
        if (code > 3) return { icon: "☁️", desc: "陰天", sky: "sky-rain" };
        return { icon: isDay ? "☀️" : "🌙", desc: isDay ? "晴朗" : "晴朗夜晚", sky: isDay ? "" : "sky-night" };
      }

      function fetchWeather() {
        var parts = state.city.split(",");
        var lat = parts[0];
        var lon = parts[1];
        var cityName = parts[2];
        document.getElementById("w-city-name").textContent = cityName;

        var url = "https://api.open-meteo.com/v1/forecast?latitude=" + lat + "&longitude=" + lon +
                  "&current=temperature_2m,is_day,weather_code&hourly=temperature_2m,weather_code,is_day&daily=temperature_2m_max,temperature_2m_min&timezone=Asia%2FTaipei&forecast_days=2";

        var xhr = new XMLHttpRequest();
        xhr.open("GET", url, true);
        xhr.onreadystatechange = function () {
          if (xhr.readyState === 4 && xhr.status === 200) {
            try {
              var data = JSON.parse(xhr.responseText);
              var cur = data.current;
              var daily = data.daily;
              var hourly = data.hourly;

              var temp = Math.round(cur.temperature_2m);
              var maxT = Math.round(daily.temperature_2m_max[0]);
              var minT = Math.round(daily.temperature_2m_min[0]);
              var info = getWeatherIconAndDesc(cur.weather_code, cur.is_day === 1);

              var widgetEl = document.getElementById("disp-weather");
              widgetEl.classList.remove("sky-night", "sky-rain");
              if (info.sky) widgetEl.classList.add(info.sky);

              document.getElementById("w-temp").textContent = temp + "°";
              document.getElementById("w-icon").textContent = info.icon;
              document.getElementById("w-desc").textContent = info.desc;
              document.getElementById("w-hl").textContent = "最高 " + maxT + "°  最低 " + minT + "°";

              var nowHour = new Date().getHours();
              var html = "";
              for (var i = 1; i <= 6; i++) {
                var idx = nowHour + i;
                if (idx < hourly.time.length) {
                  var hLabel = pad(idx % 24) + "時";
                  var hTemp = Math.round(hourly.temperature_2m[idx]);
                  var hInfo = getWeatherIconAndDesc(hourly.weather_code[idx], hourly.is_day[idx] === 1);
                  html += '<div class="w-hour-col">' +
                            '<span class="w-h-time">' + hLabel + '</span>' +
                            '<span class="w-h-icon">' + hInfo.icon + '</span>' +
                            '<span class="w-h-temp">' + hTemp + '°</span>' +
                          '</div>';
                }
              }
              if (html) document.getElementById("w-hourly-list").innerHTML = html;
            } catch (e) {}
          }
        };
        xhr.send();
      }

      function applyState() {
        document.body.className = state.theme;
        var themeBtns = document.querySelectorAll("[data-theme]");
        for (var i = 0; i < themeBtns.length; i++) {
          themeBtns[i].classList.toggle("active", themeBtns[i].getAttribute("data-theme") === state.theme);
        }

        document.getElementById("city-select").value = state.city;

        var stage = document.getElementById("clock-stage");
        stage.style.transform = "scale(" + (state.scale / 100) + ")";
        document.getElementById("scale-slider").value = state.scale;
        document.getElementById("scale-val").textContent = state.scale + "%";

        document.getElementById("dim-overlay").style.opacity = state.dim / 100;
        document.getElementById("dim-slider").value = state.dim;
        document.getElementById("dim-val").textContent = state.dim + "%";

        var toggleBtns = document.querySelectorAll("[data-toggle]");
        var anyDateOn = false;
        for (var j = 0; j < toggleBtns.length; j++) {
          var key = toggleBtns[j].getAttribute("data-toggle");
          var isOn = state.toggles[key];
          toggleBtns[j].classList.toggle("active", isOn);
          var targetEl = document.getElementById("disp-" + key);
          if (targetEl) {
            targetEl.classList.toggle("hidden-item", !isOn);
          }
          if (["year", "month", "day", "week", "lunar"].indexOf(key) !== -1 && isOn) {
            anyDateOn = true;
          }
        }
        document.getElementById("date-pill").classList.toggle("hidden-item", !anyDateOn);
        document.getElementById("battery-pill").classList.toggle("hidden-item", !state.toggles.battery);

        // 切換純時鐘模式與天氣並存模式的黃金比例樣式
        var appContainer = document.getElementById("app-container");
        appContainer.classList.toggle("mode-clock-only", !state.toggles.weather);
      }

      var hideTimer = null;
      var panel = document.getElementById("control-panel");
      function showPanel() {
        panel.classList.remove("hidden");
        clearTimeout(hideTimer);
        hideTimer = setTimeout(function () {
          panel.classList.add("hidden");
        }, 6500);
      }

      document.body.addEventListener("click", function (e) {
        if (!panel.contains(e.target)) {
          if (panel.classList.contains("hidden")) {
            showPanel();
          } else {
            panel.classList.add("hidden");
          }
        } else {
          showPanel();
        }
      });

      var themeBtns = document.querySelectorAll("[data-theme]");
      for (var i = 0; i < themeBtns.length; i++) {
        themeBtns[i].addEventListener("click", function () {
          state.theme = this.getAttribute("data-theme");
          localStorage.setItem("ipad_clock_theme_v5", state.theme);
          applyState();
        });
      }

      document.getElementById("city-select").addEventListener("change", function () {
        state.city = this.value;
        localStorage.setItem("ipad_clock_city_v5", state.city);
        fetchWeather();
      });

      var toggleBtns = document.querySelectorAll("[data-toggle]");
      for (var j = 0; j < toggleBtns.length; j++) {
        toggleBtns[j].addEventListener("click", function () {
          var key = this.getAttribute("data-toggle");
          state.toggles[key] = !state.toggles[key];
          localStorage.setItem("ipad_clock_toggles_v5", JSON.stringify(state.toggles));
          applyState();
        });
      }

      document.getElementById("scale-slider").addEventListener("input", function () {
        state.scale = parseInt(this.value, 10);
        localStorage.setItem("ipad_clock_scale_v5", state.scale);
        applyState();
      });

      document.getElementById("dim-slider").addEventListener("input", function () {
        state.dim = parseInt(this.value, 10);
        localStorage.setItem("ipad_clock_dim_v5", state.dim);
        applyState();
      });

      document.getElementById("btn-wakelock").addEventListener("click", function () {
        var vid = document.getElementById("wake-video");
        vid.play();
        this.textContent = "螢幕恆亮已啟動";
        this.classList.add("active");
      });

      setInterval(function () {
        var rx = Math.floor(Math.random() * 7) - 3;
        var ry = Math.floor(Math.random() * 7) - 3;
        document.getElementById("app-container").style.transform = "translate(" + rx + "px, " + ry + "px)";
      }, 90000);

      applyState();
      updateClock();
      initBattery();
      fetchWeather();
      setInterval(updateClock, 1000);
      setInterval(fetchWeather, 1800000);
      showPanel();
    })();
  </script>
</body>
